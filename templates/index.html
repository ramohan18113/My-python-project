<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Analytics Command Center</title>
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #090d16;
            --panel-bg: rgba(22, 29, 47, 0.65);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --text: #f3f4f6;
            --muted: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        .title {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .title-dot {
            width: 12px;
            height: 12px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--accent);
        }

        /* User Controls / Filter Panel */
        .filter-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.25rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            backdrop-filter: blur(12px);
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .filter-group label {
            font-size: 0.8rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .filter-group select {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.6rem;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .filter-group select:focus {
            border-color: var(--accent);
        }

        /* Metric Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.25rem;
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.25rem;
            backdrop-filter: blur(12px);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px -6px var(--accent-glow);
        }

        .card-label {
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 0.4rem;
        }

        .card-value {
            font-size: 1.8rem;
            font-weight: 700;
        }

        /* Chart Section */
        .chart-section {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
        }

        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }

        /* Event Logs */
        .logs-section {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.25rem;
        }

        .logs-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .log-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            font-size: 0.85rem;
        }

        .log-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0.8rem;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 6px;
            border-left: 3px solid var(--accent);
        }

        .log-time {
            color: var(--muted);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="title">
            <div class="title-dot"></div>
            <span>Telemetry Dashboard</span>
        </div>
        <span id="status-indicator" style="font-size: 0.85rem; color: #10b981;">● Live Sync Active</span>
    </header>

    <!-- User Controls for Dynamic Data -->
    <div class="filter-panel">
        <div class="filter-group">
            <label for="regionSelect">Target Region</label>
            <select id="regionSelect">
                <option value="global">Global (All Nodes)</option>
                <option value="us-east">US East (N. Virginia)</option>
                <option value="eu-west">EU West (Ireland)</option>
                <option value="ap-south">AP South (Mumbai)</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="rangeSelect">Timeframe</label>
            <select id="rangeSelect">
                <option value="7">Last 7 Days</option>
                <option value="14">Last 14 Days</option>
                <option value="30">Last 30 Days</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="modeSelect">Engine Profile</label>
            <select id="modeSelect">
                <option value="standard">Standard Mode</option>
                <option value="turbo">Turbo Boost</option>
                <option value="eco">Eco Mode</option>
            </select>
        </div>
    </div>

    <!-- Dynamic Metrics Cards -->
    <div class="metrics-grid">
        <div class="card">
            <div class="card-label">Active Connections</div>
            <div class="card-value" id="total-users">--</div>
        </div>
        <div class="card">
            <div class="card-label">Projected Revenue</div>
            <div class="card-value" id="total-revenue">--</div>
        </div>
        <div class="card">
            <div class="card-label">Avg Response Time</div>
            <div class="card-value" id="avg-response">--</div>
        </div>
        <div class="card">
            <div class="card-label">System Health</div>
            <div class="card-value" id="system-health">--</div>
        </div>
    </div>

    <!-- Dynamic Chart -->
    <div class="chart-section">
        <div class="chart-container">
            <canvas id="analyticsChart"></canvas>
        </div>
    </div>

    <!-- Dynamic Event Logs -->
    <div class="logs-section">
        <div class="logs-title">System Event Audit</div>
        <ul class="log-list" id="log-list">
            <li class="log-item">Initializing telemetry stream...</li>
        </ul>
    </div>
</div>

<script>
    let analyticsChart = null;

    // Initialize Chart.js Instance
    function initChart() {
        const ctx = document.getElementById('analyticsChart').getContext('2d');
        analyticsChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Active Users',
                    data: [],
                    borderColor: '#6366f1',
                    backgroundColor: 'rgba(99, 102, 241, 0.15)',
                    fill: true,
                    tension: 0.35,
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { labels: { color: '#f3f4f6' } }
                },
                scales: {
                    x: { ticks: { color: '#9ca3af' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                    y: { ticks: { color: '#9ca3af' }, grid: { color: 'rgba(255,255,255,0.05)' } }
                }
            }
        });
    }

    // Fetch dynamic dataset from Python backend based on current user selections
    async function updateDashboard() {
        const region = document.getElementById('regionSelect').value;
        const days = document.getElementById('rangeSelect').value;
        const mode = document.getElementById('modeSelect').value;

        try {
            const res = await fetch(`/api/v1/analytics?region=${region}&days=${days}&mode=${mode}`);
            const data = await res.json();

            if (data.status === 'success') {
                // Update Card Values
                document.getElementById('total-users').textContent = data.metrics.total_users.toLocaleString();
                document.getElementById('total-revenue').textContent = data.metrics.total_revenue;
                document.getElementById('avg-response').textContent = data.metrics.avg_response_time;
                document.getElementById('system-health').textContent = data.metrics.system_health;

                // Update Chart Data
                analyticsChart.data.labels = data.chart_data.labels;
                analyticsChart.data.datasets[0].data = data.chart_data.users;
                analyticsChart.update();

                // Update Activity Logs
                const logList = document.getElementById('log-list');
                logList.innerHTML = '';
                data.logs.forEach(log => {
                    const li = document.createElement('li');
                    li.className = 'log-item';
                    li.innerHTML = `
                        <span>${log.event}</span>
                        <span class="log-time">${log.time}</span>
                    `;
                    logList.appendChild(li);
                });
            }
        } catch (err) {
            console.error('Failed to fetch telemetry data:', err);
        }
    }

    // Bind Event Listeners to dropdown controls
    document.getElementById('regionSelect').addEventListener('change', updateDashboard);
    document.getElementById('rangeSelect').addEventListener('change', updateDashboard);
    document.getElementById('modeSelect').addEventListener('change', updateDashboard);

    // Boot App
    document.addEventListener('DOMContentLoaded', () => {
        initChart();
        updateDashboard();
    });
</script>

</body>
</html>
